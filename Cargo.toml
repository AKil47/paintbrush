[package]
name = "paintbrush"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.4"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service"] }
anyhow = "1.0"
oauth2 = { version = "5", default-features = false, features = ["ureq"] }
directories = "6.0"
